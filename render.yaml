services:
  - type: web
    name: invoice-action-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: invoice-agent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/invoice-agent.sqlite3
      - key: A2A_BASE_PATH
        value: /a2a
      - key: A2A_BASE_URL
        sync: false
      - key: AGENT_BEARER_TOKEN
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
